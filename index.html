<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puff It. Play It. Win It.</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.logo {
    width: 250px;
    max-width: 80%;
    margin-bottom: 40px;
    animation: pulse 2.5s ease-in-out infinite;
}

@keyframes pulse {
    0% {
        transform: scale(1);
        opacity: 0.75;
    }
    50% {
        transform: scale(1.08);
        opacity: 1;
    }
    100% {
        transform: scale(1);
        opacity: 0.75;
    }
}

h1 {
    font-size: clamp(2rem, 5vw, 4rem);
    margin-bottom: 15px;
}

.subtitle {
    opacity: 0.7;
    margin-bottom: 40px;
}

.countdown {
    display: flex;
    gap: 20px;
}

.time-box {
    min-width: 120px;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
}

.time-box span {
    display: block;
    font-size: 2.5rem;
    font-weight: bold;
}

.time-box small {
    opacity: 0.6;
}

@media (max-width: 600px) {

    .logo {
        width: 180px;
    }

    .countdown {
        gap: 10px;
    }

    .time-box {
        min-width: 90px;
        padding: 15px;
    }

    .time-box span {
        font-size: 1.8rem;
    }
}
</style>
</head>
<body>

<div class="container">

    <img
        src="/logo.png"
        alt="Logo"
        class="logo"
    >

    <h1>Puff It. Play It. Win It.</h1>

    <p class="subtitle">
        We blaze for real 24/7, no joke, but we also know our shit.
    </p>

    <div class="countdown">

        <div class="time-box">
            <span id="hours">00</span>
            <small>Hours</small>
        </div>

        <div class="time-box">
            <span id="minutes">00</span>
            <small>Minutes</small>
        </div>

        <div class="time-box">
            <span id="seconds">00</span>
            <small>Seconds</small>
        </div>

    </div>

</div>

<script>
function getNextSevenPM() {

    const now = new Date();

    const target = new Date();

    target.setHours(19, 0, 0, 0);

    if (now >= target) {
        target.setDate(target.getDate() + 1);
    }

    return target;
}

function updateCountdown() {

    const now = new Date();
    const target = getNextSevenPM();

    const distance = target - now;

    const hours = Math.floor(
        distance / (1000 * 60 * 60)
    );

    const minutes = Math.floor(
        (distance % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const seconds = Math.floor(
        (distance % (1000 * 60))
        / 1000
    );

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
