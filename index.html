<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wednesday Countdown</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">

        <img
            src="./logo.png"
            alt="Logo"
            class="logo"
        >

        <div class="countdown-wrapper">

            <div class="countdown">

                <div class="time-box">
                    <span id="days">00</span>
                    <small>Days</small>
                </div>

                <div class="time-box">
                    <span id="hours">00</span>
                    <small>Hours</small>
                </div>

                <div class="time-box">
                    <span id="minutes">00</span>
                    <small>Minutes</small>
                </div>

                <div class="time-box">
                    <span id="seconds">00</span>
                    <small>Seconds</small>
                </div>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
